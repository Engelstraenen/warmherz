<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>WARMHERZ Stil</title>
<link rel="stylesheet" href="../site/assets/fonts/fonts2.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:1480px;overflow:hidden;font-family:var(--body)}
/* ---------- Themes ---------- */
.a{--bg:#0E0E0E;--fg:#FFFFFF;--muted:#A3A3A3;--acc:#FF5B1F;--acc2:#FF5B1F;--panel:#1A1A1A;--line:#2A2A2A;--head:"Bricolage Grotesque";--body:"Inter Tight";--hw:800;--ls:-.045em;--tt:none;--r:12px;--sec:#F2EFEA;--secfg:#0E0E0E}
.b{--bg:#F3F0EA;--fg:#141820;--muted:#5D6470;--acc:#FF6A00;--acc2:#141820;--panel:#FFFFFF;--line:#DAD4C9;--head:"Archivo";--body:"Inter Tight";--hw:850;--ls:-.01em;--tt:uppercase;--r:6px;--sec:#141820;--secfg:#F3F0EA}
.c{--bg:#15110E;--fg:#FFF7EF;--muted:#B8A99C;--acc:#FF7A1A;--acc2:#FFC24B;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--head:"Inter Tight";--body:"Inter Tight";--hw:800;--ls:-.04em;--tt:none;--r:18px;--sec:#FFF7EF;--secfg:#15110E}
body{background:var(--bg);color:var(--fg)}
.nav{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;gap:30px;padding:22px 44px;color:#fff}
.logo{font:var(--hw) 24px var(--head);letter-spacing:.02em;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font-style:normal;font-size:18px}
.links{margin-left:auto;display:flex;gap:28px;font:600 15px var(--body)}
.chip{font:700 14px var(--body);padding:10px 16px;border-radius:999px;background:var(--acc);color:#fff}
.b .chip{border-radius:4px}
.hero{position:relative;height:900px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 50%,rgba(0,0,0,.88) 100%)}
.b .shade{background:linear-gradient(180deg,rgba(20,24,32,.6) 0%,rgba(20,24,32,0) 22%,rgba(20,24,32,0) 45%,rgba(20,24,32,.92) 100%)}
.copy{position:absolute;left:44px;right:44px;bottom:48px;color:#fff;display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px}
h1{font:var(--hw) 118px/0.9 var(--head);letter-spacing:var(--ls);text-transform:var(--tt)}
.b h1{font-stretch:75%;font-size:112px;line-height:.86}
h1 span{color:var(--acc)}
.c h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.sub{font:500 20px/1.45 var(--body);color:#E8E2DA;max-width:46ch;margin-top:20px}
.ctas{display:flex;flex-direction:column;gap:12px;min-width:330px}
.btn{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-radius:var(--r);font:700 18px var(--body);background:var(--acc);color:#fff}
.btn.o{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(8px)}
.b .btn{text-transform:uppercase;letter-spacing:.04em;font-size:16px}
/* Platz-Marker */
.pin{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:4}
.ring{width:170px;height:170px;border-radius:50%;border:5px solid var(--acc);box-shadow:0 0 0 10px rgba(255,91,31,.25),0 0 60px rgba(255,91,31,.7),inset 0 0 40px rgba(255,91,31,.35)}
.b .ring{border-radius:10px}
.tagp{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%);white-space:nowrap;background:var(--acc);color:#fff;padding:12px 18px;border-radius:var(--r);font:800 20px var(--body);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.tagp small{display:block;font:600 13px var(--body);opacity:.9}
.tagp::after{content:"";position:absolute;left:50%;top:100%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--acc)}
.b .tagp{text-transform:uppercase;letter-spacing:.03em}
/* Abschnitt-Probe */
.sec{background:var(--sec);color:var(--secfg);height:580px;padding:70px 44px;display:grid;grid-template-columns:1.1fr .9fr;gap:60px}
.kick{font:800 14px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:18px}
h2{font:var(--hw) 72px/0.95 var(--head);letter-spacing:var(--ls);text-transform:var(--tt)}
.b h2{font-stretch:75%;font-size:84px}
h2 span{color:var(--acc)}
.p{font:500 19px/1.5 var(--body);opacity:.75;margin-top:20px;max-width:44ch}
.card{background:var(--bg);color:var(--fg);border-radius:calc(var(--r) + 8px);padding:34px}
.card small{font:600 14px var(--body);color:var(--muted)}
.big{font:var(--hw) 96px/1 var(--head);letter-spacing:var(--ls);color:var(--acc);margin:8px 0 18px}
.c .big{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row div{padding:16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
.row b{display:block;font:var(--hw) 28px var(--head)}
.loss b{color:var(--acc)}
/* B: Text oben, Foto-Objekt unten frei */
.c .hero img{object-position:50% 100%}
.c .label{top:auto;bottom:40px;left:64px}
/* C: hell, Magazin – Überschrift oben, Foto im Rahmen */
.c .hero{background:var(--bg)}
.c .hero img{position:absolute;left:44px;top:390px;width:1352px;height:490px;border-radius:26px}
.c .shade{display:none}
.c .nav{color:var(--fg)}
.c .copy{top:110px;bottom:auto;color:var(--fg)}
.c h1{font-size:104px}
.c .sub{color:var(--muted)}
.c .btn.o{background:transparent;border-color:var(--fg);color:var(--fg)}
.c{--bg:#FBF6EF;--fg:#1B1410;--muted:#7B6A5D;--acc:#F2541B;--acc2:#FF9A2E;--panel:#F1E8DC;--line:#E5D9C9;--sec:#1B1410;--secfg:#FBF6EF}
.c .card{background:#fff}
.name{position:absolute;right:44px;top:120px;z-index:6;background:#fff;color:#111;padding:14px 18px;border-radius:var(--r);font:700 18px var(--body);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.name small{display:block;font-weight:600;font-size:13px;color:var(--acc)}
.label{position:absolute;left:44px;top:96px;z-index:6;font:800 13px var(--body);letter-spacing:.2em;text-transform:uppercase;background:#fff;color:#111;padding:8px 12px;border-radius:4px}
</style></head><body>
<div id="r"></div>
<script>
const q=new URLSearchParams(location.search), th=(location.hash||'#a').slice(1);
document.body.className=th;
const names={a:'Richtung A · Signal',b:'Richtung B · Werkstatt',c:'Richtung C · Magazin'};
const img=q.get('img')||'team', x=q.get('x')||'50', y=q.get('y')||'70';
document.getElementById('r').innerHTML=`
<div class="hero"><img src="../site/assets/img/${img}.webp">
 <div class="shade"></div>
 <div class="label">${names[th]}</div>
 <div class="nav"><div class="logo"><i>♥</i>Warmherz</div><div class="links"><span>Ein Tag</span><span>Leistungen</span><span>Wärmepumpe</span><span>Förderung</span><span>Jobs</span></div><div class="chip">● 74 Tage Bonus</div></div>
 <div class="pin" style="--x:${x}%;--y:${y}%"><div class="tagp">Dein Platz<small>Wir suchen 2 Monteure →</small></div><div class="ring"></div></div>
 <div class="copy"><div><h1>Wir machen<br>Bielefeld <span>warm.</span></h1><p class="sub">Wärmepumpen, Heizung und Bad. Von sechs Leuten, die Sie mit Namen kennen. Seit 1987.</p></div>
 <div class="ctas"><div class="btn">Zuschuss berechnen <span>→</span></div><div class="btn o">Jobs bei uns <span>→</span></div></div></div>
</div>
<div class="sec"><div><div class="kick">Förderrechner · 1 Minute</div><h2>Wie viel bekommen <span>Sie</span> geschenkt?</h2><p class="p">Drei Angaben, sofort ein Betrag in Euro. Und was Sie verlieren, wenn Sie bis Februar warten.</p></div>
<div class="card"><small>Ihr Zuschuss, wenn Sie jetzt beauftragen</small><div class="big">14.280 €</div><div class="row"><div><small>ab 1. Februar 2027</small><b>12.808 €</b></div><div class="loss"><small>Wer wartet, verliert</small><b>− 1.473 €</b></div></div></div></div>`;
// Marker auf object-fit:cover-Bild umrechnen (x/y = Anteil im Originalfoto)
addEventListener('load',()=>{const im=document.querySelector('.hero img'),pin=document.querySelector('.pin');
 const bw=im.clientWidth,bh=im.clientHeight,sc=Math.max(bw/im.naturalWidth,bh/im.naturalHeight),rw=im.naturalWidth*sc,rh=im.naturalHeight*sc;
 const op=getComputedStyle(im).objectPosition.split(' ').map(v=>parseFloat(v)/100);
 pin.style.left=(im.offsetLeft+(bw-rw)*op[0]+x/100*rw)+'px';pin.style.top=(im.offsetTop+(bh-rh)*op[1]+y/100*rh)+'px';});
</script></body></html>

<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>WARMHERZ First Frames</title>
<link rel="stylesheet" href="../site/assets/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:2400px;height:1260px;background:#F6EFE6;color:#2B1D14;font-family:Manrope,Helvetica,sans-serif;overflow:hidden}
.wrap{display:grid;grid-template-columns:1776px 1fr;gap:44px;padding:40px 48px}
.shot{position:relative;width:1776px;height:1110px;border-radius:22px;overflow:hidden;border:3px solid #2B1D14;box-shadow:14px 14px 0 rgba(43,29,20,.12);background:#000}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top}
.m{position:absolute;width:62px;height:62px;margin:-31px;border-radius:50%;background:#D9622B;color:#fff;font:600 30px/56px Fraunces,Georgia,serif;text-align:center;border:4px solid #fff;box-shadow:0 0 0 6px rgba(217,98,43,.35),0 8px 20px rgba(0,0,0,.4)}
.side{display:flex;flex-direction:column;padding-top:6px}
.brand{font:600 20px Fraunces,serif;letter-spacing:.18em;color:#D9622B}
.no{font:600 120px/0.9 Fraunces,serif;color:#D9622B;margin-top:24px}
h1{font:400 50px/1.05 Fraunces,serif;margin-top:12px}
h1 em{color:#D9622B}
.kick{font-size:17px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A6455;margin-top:16px}
.motion{margin-top:28px;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#2F6F6A;display:flex;align-items:center;gap:10px}
.motion::before{content:"";width:26px;height:2px;background:#2F6F6A}
ol{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:14px}
li{display:grid;grid-template-columns:40px 1fr;gap:12px;font-size:19px;line-height:1.36}
li b{width:38px;height:38px;border-radius:50%;background:#D9622B;color:#fff;font:600 20px/38px Fraunces,serif;text-align:center}
.tags{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.tag{font-size:17px;font-weight:700;padding:10px 16px;border-radius:14px;border:2px solid}
.k{color:#D9622B;border-color:#D9622B}.b{color:#2F6F6A;border-color:#2F6F6A}
.foot{position:absolute;left:48px;bottom:22px;font-size:15px;color:#7A6455}
</style></head><body><div id="r"></div>
<script>
const S='/private/tmp/claude-501/s/';
const F=[
{img:'f01',t:'Start: Das Team <em>und eine Lücke</em>',k:'Startseite · ganz oben',m:[
 [1,4,73,'Überschrift baut sich Buchstabe für Buchstabe auf, von unscharf zu scharf.'],
 [2,8,40,'Foto zoomt ganz langsam heran (Ken Burns, 20 Sekunden).'],
 [3,24,22,'Leuchtpunkte über den Köpfen pulsieren. Maus drauf: Namenskarte, hier „Lukas, 31“.'],
 [4,60,24,'Die Lücke: gestrichelte Silhouette läuft und glüht. „Dein Platz?“ führt zu den Jobs.'],
 [5,88,55,'Warmer Lichtkegel folgt der Maus wie eine Wärmebildkamera.'],
 [6,72,92,'Beim Scrollen bleibt das Foto zurück (Tiefe), der Text gleitet nach oben weg.']],
 tg:['k:Kunde sieht: echte Leute mit Namen','b:Bewerber sieht: da ist Platz für mich']},
{img:'f02',t:'Countdown <em>bis 1. Februar</em>',k:'Band direkt unter dem Foto',m:[
 [1,9,7,'Sekunden zählen live herunter, bis der Förderbonus sinkt.'],
 [2,50,16,'Laufband mit allen Leistungen zieht endlos durch.'],
 [3,93,2,'Kleiner Countdown-Chip im Menü bleibt beim Scrollen immer sichtbar.']],
 tg:['k:Kunde spürt: jetzt handeln lohnt sich']},
{img:'f03',t:'Ein Tag <em>mit Lukas</em>',k:'Scroll-Geschichte · Einstieg',m:[

 [2,60,85,'Fotos öffnen sich aus einem kleinen Rahmen zum vollen Bild.'],
 [3,88,22,'Hintergrund wechselt mit der Tageszeit: Morgengrauen, Mittag, Abend.']],
 tg:['k:Kunde sieht, wer zu ihm kommt','b:Bewerber sieht, wie der Tag sich anfühlt']},
{img:'f04b',t:'07:40 · <em>Lea lernt mit</em>',k:'Szene 2 von 7',m:[
 [1,62,30,'Foto bewegt sich langsamer als die Seite, das gibt Tiefe.'],
 [2,72,91,'Je Szene zwei Hinweise: orange für Kunden, grün für Bewerber.'],

 tg:['k:Einweisung inklusive','b:Arbeit, die man sieht']},
{img:'f06',t:'Leistungen <em>zum Anfassen</em>',k:'Was wir machen',m:[

 [3,82,58,'Beim Scrollen fliegen die Karten nacheinander ein.']],
 tg:['k:Alles aus einer Hand']},
{img:'f07',t:'Die Wärmepumpe, <em>interaktiv</em>',k:'Haus im Querschnitt',m:[

 [3,62,92,'Heizwasser fließt sichtbar durch Rohre und Fußbodenheizung.'],

{img:'f08',t:'Förderrechner <em>mit Druck</em>',k:'1 Minute, live',m:[

{img:'f09',t:'Vorab-Check: <em>3 Fotos</em>',k:'Statt Besichtigung',m:[

{img:'f10',t:'Hier fehlt noch <em>jemand</em>',k:'Karriere · Einstieg',m:[

 tg:['b:Bewerber: Da passe ich rein']},
{img:'f11',t:'Gründe <em>und Stellen</em>',k:'Karriere',m:[
 [1,14,8,'Kacheln kippen in 3D, große Zahlen statt Floskeln.'],
 [2,40,40,'Stellen gleiten von links herein, Klick klappt auf.'],
 [3,90,40,'Gehalt steht offen und immer sichtbar rechts.']],
 tg:['b:Gehalt, Feierabend, Prämie: alles klar']},
{img:'f12',t:'Bewerben in <em>60 Sekunden</em>',k:'Chat statt Formular',m:[
 [1,70,45,'Bot tippt (drei Punkte), dann kommt die nächste Frage.'],
 [2,72,77,'Antworten per Knopf, wie bei WhatsApp. Kein Lebenslauf.'],
 [3,30,75,'Heinz’ Gesicht: der Mensch, der heute noch zurückruft.']],

{img:'f13',t:'Der Chef <em>sucht Nachfolger</em>',k:'Ehrliches Wort',m:[
 [1,15,55,'Großes Porträt, Zitat baut sich beim Scrollen auf.'],
 [2,26,92,'Knopf „Sprich mit Heinz“ führt zur Bewerbung.']],
 tg:['k:Kunde: der Betrieb bleibt','b:Geselle: hier kann ich Meister werden']}
];
const i=+(location.hash.slice(1)||0), f=F[i];
document.getElementById('r').innerHTML=`<div class="wrap"><div class="shot"><img src="${S+f.img}.png">${f.m.map(m=>`<div class="m" style="left:${m[1]}%;top:${m[2]}%">${m[0]}</div>`).join('')}</div>
<div class="side"><div class="brand">WARMHERZ · FIRST FRAMES</div><div class="no">${String(i+1).padStart(2,'0')}</div><h1>${f.t}</h1><div class="kick">${f.k}</div>
<div class="motion">Was sich bewegt</div><ol>${f.m.map(m=>`<li><b>${m[0]}</b><span>${m[3]}</span></li>`).join('')}</ol>
<div class="tags">${f.tg.map(t=>`<span class="tag ${t[0]}">${t.slice(2)}</span>`).join('')}</div></div></div>
<div class="foot">Echte Seite, echter Screenshot (Desktop 1440 px) · Fotos: sjinn Nano Banana 2.1, 4K · fiktive Demo-Marke</div>`;
</script></body></html>

<!-- ============ NOTDIENST-FILM (Video + Schlagwörter, synchron zur Videozeit) ============ -->
<section class="film-sec" id="notdienst-film">
  <div class="wrap">
    <div class="film" data-film>
      <video data-src="assets/video/notdienst.mp4" data-src-m="assets/video/notdienst-720.mp4" poster="assets/img/notdienst-poster.webp" muted loop playsinline preload="metadata" aria-label="Notdienst-Film: Murat kommt nachts im Schnee zu einer Familie"></video>
      <div class="film-shade" aria-hidden="true"></div>

      <div class="film-hud" aria-hidden="true">
        <span class="fh-chip" data-at="0.2"><b data-clock>02:14</b> Uhr</span>
        <span class="fh-chip" data-at="0.7"><b>−8</b> °C</span>
      </div>

      <div class="film-words" aria-hidden="true">
        <p class="fw" data-at="2.2" data-out="4.3">Heizung aus.</p>
        <p class="fw" data-at="4.5" data-out="6.7">Wir kommen <em>trotzdem.</em></p>
        <p class="fw" data-at="6.9" data-out="8.6">Rund um die Uhr.</p>
      </div>

      <div class="film-end" data-at="8.6" aria-hidden="true">
        <p class="fe-k">Notdienst · 24/7</p>
        <p class="fe-h">Wenn es kalt wird, <em>sind wir da.</em></p>
      </div>

      <button class="film-sound" type="button" data-sound aria-pressed="false"><span class="ic" aria-hidden="true"></span><span data-sound-t>Mit Ton ansehen</span></button>
      <div class="film-bar" aria-hidden="true"><i data-film-bar></i></div>
    </div>
    <div class="film-under">
      <p>Echte Menschen, auch nachts. <b>Murat</b> und sein Team fahren im Winter Notdienst für Bielefeld und Umgebung.</p>
      <a href="tel:+495210000099" class="btn acc">0521 000 00 99 <span>→</span></a>
    </div>
  </div>
</section>

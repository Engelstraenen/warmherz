<!-- ============ KOPFBEREICH WARTUNG = NOTDIENST-FILM (Video statt Foto, Schlagwörter synchron zur Videozeit) ============ -->
<section class="phero film-hero" id="notdienst-film" data-film>
  <video data-src="assets/video/notdienst.mp4" data-src-m="assets/video/notdienst-720.mp4" poster="assets/img/notdienst-poster.webp" muted loop playsinline preload="auto" aria-label="Notdienst-Film: Murat kommt nachts im Schnee zu einer Familie"></video>
  <div class="shade"></div>

  <div class="film-hud" aria-hidden="true">
    <span class="fh-chip" data-at="0.2"><b data-clock>02:14</b> Uhr</span>
    <span class="fh-chip" data-at="0.7"><b>−8</b> °C</span>
  </div>

  <div class="in">
    <div class="crumbs"><a href="index.html">Start</a><span>/</span>Leistungen<span>/</span>Wartung &amp; Notdienst</div>
    <p class="kicker">Wartung &amp; Notdienst · 24/7</p>
    <div class="film-stage">
      <h1 class="film-h1">Wenn es kalt wird,<br> <em>sind wir da.</em></h1>
    </div>
    <div class="ctas">
      <button class="btn acc film-sound" type="button" data-sound aria-pressed="false"><span class="ic" aria-hidden="true"></span><span data-sound-t>Film mit Ton ansehen</span></button>
      <a href="tel:+495210000099" class="btn white">Notdienst: 0521 000 00 99 <span>→</span></a>
      <a href="foto-check.html" class="btn line">Störung per Foto melden <span>→</span></a>
    </div>
    {{> rating-chips}}
  </div>
  <div class="film-bar" aria-hidden="true"><i data-film-bar></i></div>
</section>

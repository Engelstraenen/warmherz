<section class="ba" id="vorher-nachher">
  <div class="wrap">
    <p class="kicker">Vorher / Nachher</p>
    <h2 class="reveal">Aus dem Öltank-Keller wird <em>Platz.</em></h2>
    <div class="ba-box" data-ba style="--p:50%">
      <img src="assets/img/keller-nachher.webp" alt="Nachher: heller Technikraum mit Wärmepumpe" loading="lazy">
      <div class="ba-before"><img src="assets/img/keller-vorher.webp" alt="Vorher: alter Heizungskeller mit Öltank" loading="lazy"></div>
      <span class="ba-tag l">1990</span><span class="ba-tag r">Heute</span>
      <input type="range" min="0" max="100" value="50" aria-label="Vorher-Nachher-Regler" data-ba-range>
      <div class="ba-handle" aria-hidden="true"><span>⟷</span></div>
    </div>
    <div class="ba-facts"><div><b>⅓</b><span>Platz im Keller gewonnen</span></div><div><b>0</b><span>Öllieferungen pro Jahr</span></div><div><b>2,5</b><span>Tage Einbau</span></div></div>
  </div>
</section>
